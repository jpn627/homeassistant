blueprint:
  name: Lutron Pico Remote to Fan & Light Controller
  description: >-
    Control a fan and its integrated light using a 5-button Lutron Pico Remote.

    - On: turn the fan on, restoring the last known speed
    - Off: turn the fan off
    - Center (stop): toggle the fan light
    - Raise / Lower: increase / decrease fan speed

    For a true "restore last speed" you can optionally provide an input_number
    helper; the blueprint stores the fan's speed there whenever it changes and
    reads it back when you press On. Without a helper it falls back to the fan's
    current speed, then to the configured default speed.
  domain: automation
  homeassistant:
    min_version: 2024.8.0
  input:
    pico_remote:
      name: Lutron Pico Remote
      description: Select the Lutron Caséta Pico remote to use.
      selector:
        device:
          integration: lutron_caseta
    fan_target:
      name: Fan
      description: Select the ceiling fan entity to control.
      selector:
        entity:
          domain: fan
    light_target:
      name: Fan Light
      description: Select the fan's light entity to toggle.
      selector:
        entity:
          domain: light
    last_speed_helper:
      name: (Optional) Last Speed Helper
      description: >-
        An input_number helper used to remember the fan's last speed across
        off/on cycles. Create one under Settings > Devices & Services > Helpers
        (Number, min 0, max 100). Leave empty to fall back to the fan's current
        speed / the default speed below.
      default: []
      selector:
        entity:
          filter:
            - domain: input_number
          multiple: false
    default_speed:
      name: Default / Fallback Speed
      description: Speed used when turning the fan on if no previous speed is known.
      default: 33
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

# Expose inputs to the Jinja template engine
variables:
  fan_entity: !input fan_target
  last_speed_helper: !input last_speed_helper
  default_speed: !input default_speed

trigger:
  - platform: device
    device_id: !input pico_remote
    domain: lutron_caseta
    type: press
    subtype: 'on'
    id: pico_on
  - platform: device
    device_id: !input pico_remote
    domain: lutron_caseta
    type: press
    subtype: 'off'
    id: pico_off
  - platform: device
    device_id: !input pico_remote
    domain: lutron_caseta
    type: press
    subtype: stop
    id: button_stop
  - platform: device
    device_id: !input pico_remote
    domain: lutron_caseta
    type: press
    subtype: raise
    id: button_raise
  - platform: device
    device_id: !input pico_remote
    domain: lutron_caseta
    type: press
    subtype: lower
    id: button_lower
  # Remember the fan's speed whenever it changes (only used if a helper is set)
  - platform: state
    entity_id: !input fan_target
    attribute: percentage
    id: fan_speed_changed

condition: []

action:
  - choose:
      # ON Button -> Turn fan on, restoring last speed (helper > current > default)
      - conditions:
          - condition: trigger
            id: pico_on
        sequence:
          - action: fan.turn_on
            target:
              entity_id: !input fan_target
            data:
              percentage: >-
                {% set helper = states(last_speed_helper) | int(0) if last_speed_helper not in [none, []] else 0 %}
                {% set current = state_attr(fan_entity, 'percentage') | int(0) %}
                {{ helper if helper > 0 else (current if current > 0 else default_speed) }}

      # OFF Button -> Turn Fan Off
      - conditions:
          - condition: trigger
            id: pico_off
        sequence:
          - action: fan.turn_off
            target:
              entity_id: !input fan_target

      # STOP (Center) Button -> Toggle Fan Light
      - conditions:
          - condition: trigger
            id: button_stop
        sequence:
          - action: light.toggle
            target:
              entity_id: !input light_target

      # RAISE Button -> Increase Fan Speed
      - conditions:
          - condition: trigger
            id: button_raise
        sequence:
          - action: fan.increase_speed
            target:
              entity_id: !input fan_target

      # LOWER Button -> Decrease Fan Speed
      - conditions:
          - condition: trigger
            id: button_lower
        sequence:
          - action: fan.decrease_speed
            target:
              entity_id: !input fan_target

      # Fan speed changed -> Persist it to the helper (only when set and > 0)
      - conditions:
          - condition: trigger
            id: fan_speed_changed
          - condition: template
            value_template: "{{ last_speed_helper not in [none, []] }}"
          - condition: template
            value_template: "{{ state_attr(fan_entity, 'percentage') | int(0) > 0 }}"
        sequence:
          - action: input_number.set_value
            target:
              entity_id: !input last_speed_helper
            data:
              value: "{{ state_attr(fan_entity, 'percentage') | int(0) }}"

# Queued so rapid Raise/Lower presses are processed in order instead of dropped
mode: queued
max: 10
max_exceeded: silent
