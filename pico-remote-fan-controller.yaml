blueprint:
  name: Lutron Pico Remote to Fan & Light Controller
  description: Control a fan and its integrated light using a 5-button Lutron Pico Remote with debouncing.
  domain: automation
  input:
    pico_remote:
      name: Lutron Pico Remote
      description: Select the Lutron Caséta Pico remote to use.
      selector:
        device:
          integration: lutron_caseta
    fan_target:
      name: Fan
      description: Select the ceiling fan entity to control.
      selector:
        entity:
          domain: fan
    light_target:
      name: Fan Light
      description: Select the fan's light entity to toggle.
      selector:
        entity:
          domain: light

trigger:
  - platform: device
    device_id: !input pico_remote
    domain: lutron_caseta
    type: press
    subtype: 'on'
    id: button_on
  - platform: device
    device_id: !input pico_remote
    domain: lutron_caseta
    type: press
    subtype: 'off'
    id: button_off
  - platform: device
    device_id: !input pico_remote
    domain: lutron_caseta
    type: press
    subtype: stop
    id: button_stop
  - platform: device
    device_id: !input pico_remote
    domain: lutron_caseta
    type: press
    subtype: raise
    id: button_raise
  - platform: device
    device_id: !input pico_remote
    domain: lutron_caseta
    type: press
    subtype: lower
    id: button_lower

condition: []

action:
  - choose:
      # ON Button -> Turn Fan On (Low Preset)
      - conditions:
          - condition: trigger
            id: button_on
        sequence:
          - action: fan.turn_on
            target:
              entity_id: !input fan_target
            data:
              preset_mode: low

      # OFF Button -> Turn Fan Off
      - conditions:
          - condition: trigger
            id: button_off
        sequence:
          - action: fan.turn_off
            target:
              entity_id: !input fan_target

      # STOP (Center) Button -> Toggle Fan Light
      - conditions:
          - condition: trigger
            id: button_stop
        sequence:
          - action: light.toggle
            target:
              entity_id: !input light_target

      # RAISE Button -> Increase Fan Speed
      - conditions:
          - condition: trigger
            id: button_raise
        sequence:
          - action: fan.increase_speed
            target:
              entity_id: !input fan_target

      # LOWER Button -> Decrease Fan Speed
      - conditions:
          - condition: trigger
            id: button_lower
        sequence:
          - action: fan.decrease_speed
            target:
              entity_id: !input fan_target

  # Debounce mechanism: Holds the automation lock for 250ms to ignore bounced signals
  - delay:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 250

mode: single
