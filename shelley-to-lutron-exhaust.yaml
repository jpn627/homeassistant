blueprint:
  name: Shower Fan Auto-On (Absolute Humidity)
  description: >
    Turns on a Lutron Caseta switch (exhaust fan) when humidity from a
    Shelly H&T Gen3 rises above a threshold, and turns it off once humidity
    falls back down (with a safety max-runtime). Designed for sleepy
    battery sensors that only report on large changes. For best results,
    power the Shelly via USB or lower its reporting threshold to ~1%.
  domain: automation
  input:
    humidity_sensor:
      name: Humidity Sensor
      description: The Shelly H&T Gen3 humidity sensor entity.
      selector:
        entity:
          domain: sensor
          device_class: humidity
    fan_switch:
      name: Exhaust Fan Switch
      description: The Lutron Caseta switch controlling the exhaust fan.
      selector:
        entity:
          domain: switch
    on_threshold:
      name: Turn-On Humidity (%)
      description: Turn the fan on when humidity rises above this.
      default: 68
      selector:
        number: { min: 40, max: 95, unit_of_measurement: "%", mode: slider }
    off_threshold:
      name: Turn-Off Humidity (%)
      description: >
        Turn the fan off once humidity falls back below this. Should be a
        few points below your turn-on value (and ideally near your normal
        ambient humidity).
      default: 58
      selector:
        number: { min: 30, max: 90, unit_of_measurement: "%", mode: slider }
    max_runtime:
      name: Maximum Run Time
      description: >
        Safety cap. Fan turns off after this long even if humidity never
        drops below the off threshold (e.g. slow-reporting sensor).
      default: { hours: 2 }
      selector:
        duration:

variables:
  off_threshold: !input off_threshold
  humidity_sensor: !input humidity_sensor

trigger:
  - platform: numeric_state
    entity_id: !input humidity_sensor
    above: !input on_threshold
    id: humid_high
  - platform: numeric_state
    entity_id: !input humidity_sensor
    below: !input off_threshold
    id: humid_low

action:
  - choose:
      - conditions:
          - condition: trigger
            id: humid_high
        sequence:
          - service: switch.turn_on
            target: { entity_id: !input fan_switch }
          # Safety cutoff: wait for humidity to drop OR max runtime
          - wait_template: "{{ states(humidity_sensor) | float(100) < off_threshold }}"
            timeout: !input max_runtime
            continue_on_timeout: true
          - service: switch.turn_off
            target: { entity_id: !input fan_switch }
      - conditions:
          - condition: trigger
            id: humid_low
        sequence:
          - service: switch.turn_off
            target: { entity_id: !input fan_switch }

mode: restart
