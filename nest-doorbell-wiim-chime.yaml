blueprint:
  name: Nest Doorbell Chime on WiiM Speakers
  description: >-
    Play a doorbell chime through one or more WiiM (or any announce-capable)
    speakers when a Nest doorbell is pressed.

    Uses Home Assistant's media_player "announce" feature (announce: true).
    On WiiM native sources (WiFi streaming, TuneIn, USB, etc.) the firmware
    ducks the current audio, plays the chime, and auto-resumes the music. If
    nothing is playing, it simply plays the chime.

    Note: auto-resume is a device feature and does NOT work for Spotify
    Connect, AirPlay, or Bluetooth sources - on those the chime interrupts
    playback (it cannot be resumed). This is a WiiM firmware limitation.

    Physical inputs (HDMI / optical / line-in): when chiming over a live input
    - e.g. a WiiM Ultra fed by a TV via HDMI ARC - the device may not switch
    back to that input after the chime. Enable "Restore source after chime"
    below to capture the current input before the chime and switch back to it
    afterward, so live TV audio returns automatically.

    Optional TV pause: you can have a separate media player paused while the
    chime plays (e.g. a Google TV Streamer added via the Android TV Remote
    integration). The automation waits for the chime to finish, then restores
    the input and - if you enable it - resumes playback.

    Chime customization: optionally set the chime volume (restored afterward),
    and use a different sound and/or volume during an evening window - e.g. a
    softer chime at a lower volume in the evening.

    Setup tips:
      - Put a chime file (e.g. doorbell.mp3) in your Home Assistant media
        folder (/media) or /config/www, then pick it below.
      - The doorbell "press" is exposed by the Nest integration as an event
        entity with device class "doorbell".
  domain: automation
  homeassistant:
    min_version: 2024.8.0
  author: jpn627
  input:
    doorbell_event:
      name: Nest Doorbell Press Event
      description: >-
        The Nest doorbell's event entity (device class "doorbell"). Find it
        under Settings > Devices & Services > Nest > your doorbell device.
      selector:
        entity:
          filter:
            - domain: event
              device_class: doorbell
          multiple: false
    target_speakers:
      name: Speaker(s)
      description: One or more WiiM (or other announce-capable) media players to chime on.
      selector:
        entity:
          filter:
            - domain: media_player
          multiple: true
    chime_sound:
      name: Chime Sound
      description: >-
        The sound to play. Browse to a file you've placed in /media or
        /config/www. Most common audio formats (mp3, wav) work.
      selector:
        media: {}
    control_volume:
      name: Set chime volume
      description: >-
        Set the speakers to a fixed volume for the chime, then restore their
        previous volume afterward - so the doorbell stays audible even if you
        were listening quietly. (With WiiM "announce" the device may apply its
        own volume handling; this is most predictable on the TV / physical-input
        path.)
      default: false
      selector:
        boolean: {}
    chime_volume:
      name: Daytime chime volume
      description: Volume for the chime, used when "Set chime volume" is on.
      default: 60
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    evening_enabled:
      name: Use a different chime in the evening
      description: >-
        During an evening window, play a different sound and/or volume. This is
        separate from Quiet Hours (which silences the chime entirely).
      default: false
      selector:
        boolean: {}
    evening_chime_sound:
      name: Evening Chime Sound
      description: >-
        Sound to play during the evening window. Leave empty to keep the daytime
        sound but still apply the evening volume below.
      default: {}
      selector:
        media: {}
    evening_volume:
      name: Evening chime volume
      description: Volume during the evening window, used when "Set chime volume" is on.
      default: 30
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    evening_start:
      name: Evening Start
      description: When the evening chime window begins.
      default: "20:00:00"
      selector:
        time: {}
    evening_end:
      name: Evening End
      description: When the evening chime window ends (can span midnight).
      default: "07:00:00"
      selector:
        time: {}
    cooldown:
      name: Cooldown (seconds)
      description: >-
        Ignore repeated doorbell presses for this many seconds after a chime,
        to avoid a barrage if someone leans on the button. Set to 0 to disable.
      default: 5
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: seconds
          mode: box
    quiet_hours_enabled:
      name: Enable Quiet Hours
      description: When on, the chime is silenced during the time window below.
      default: false
      selector:
        boolean: {}
    quiet_start:
      name: Quiet Hours Start
      description: Time the quiet window begins (can span midnight).
      default: "22:00:00"
      selector:
        time: {}
    quiet_end:
      name: Quiet Hours End
      description: Time the quiet window ends.
      default: "07:00:00"
      selector:
        time: {}
    restore_source:
      name: Restore source after chime
      description: >-
        After the chime, switch the speaker back to the input it was on (HDMI,
        optical, line-in, etc.). Useful when chiming over a live TV feed so the
        TV audio returns. Leave off when chiming over streaming music (the
        announce feature already handles that).
      default: false
      selector:
        boolean: {}
    chime_wait:
      name: Max wait for chime to finish (seconds)
      description: >-
        Before restoring the input or resuming playback, the automation waits
        for the chime to finish. It watches the speaker's playback state and
        stops waiting as soon as the chime ends; this is the maximum it will
        wait (and the fallback wait if the speaker doesn't report state). Set a
        little longer than your longest chime.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: seconds
          mode: box
    pause_target:
      name: (Optional) Pause this player during the chime
      description: >-
        A media player to pause while the chime plays - e.g. your Google TV
        Streamer (added via the Android TV Remote integration). Note: pausing
        the Vizio TV itself will NOT pause content playing from an external HDMI
        device, so target the streamer that is actually playing. Leave empty to
        disable.
      default: []
      selector:
        entity:
          filter:
            - domain: media_player
          multiple: false
    pause_resume:
      name: Resume playback after chime
      description: >-
        After the chime, press play to resume what was paused. Off (default)
        leaves it paused - handy since a doorbell usually means you are getting
        up to answer, so you will not miss anything.
      default: false
      selector:
        boolean: {}

# Make inputs available to templates
variables:
  chime: !input chime_sound
  quiet_enabled: !input quiet_hours_enabled
  quiet_start: !input quiet_start
  quiet_end: !input quiet_end
  restore_source: !input restore_source
  target_list: !input target_speakers
  pause_target: !input pause_target
  pause_resume: !input pause_resume
  primary_speaker: "{{ (target_list | first) if target_list else none }}"
  control_volume: !input control_volume
  chime_volume: !input chime_volume
  evening_enabled: !input evening_enabled
  evening_chime: !input evening_chime_sound
  evening_volume: !input evening_volume
  evening_start: !input evening_start
  evening_end: !input evening_end

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input doorbell_event
    # An event entity's state is a timestamp that updates on each press.
    # Ignore transitions to unavailable/unknown so only real presses fire.
    not_to:
      - unavailable
      - unknown

condition:
  # Quiet hours: block the chime when enabled and inside the window.
  # Handles overnight windows (e.g. 22:00 -> 07:00).
  - condition: template
    value_template: >-
      {% set cur = now().hour * 60 + now().minute %}
      {% set sp = quiet_start.split(':') %}
      {% set ep = quiet_end.split(':') %}
      {% set start = sp[0] | int * 60 + sp[1] | int %}
      {% set end = ep[0] | int * 60 + ep[1] | int %}
      {% if start == end %}
        {% set quiet = false %}
      {% elif start < end %}
        {% set quiet = start <= cur < end %}
      {% else %}
        {% set quiet = cur >= start or cur < end %}
      {% endif %}
      {{ not quiet_enabled or not quiet }}

action:
  # Snapshot speaker inputs + volumes (for restore), decide whether to pause the
  # TV, and pick the chime/volume for the current time of day.
  - variables:
      saved_state: >-
        {% set ns = namespace(items=[]) %}
        {% for e in target_list %}
          {% set ns.items = ns.items + [{
            'entity_id': e,
            'source': state_attr(e, 'source'),
            'volume': state_attr(e, 'volume_level') }] %}
        {% endfor %}
        {{ ns.items }}
      did_pause: >-
        {{ pause_target not in [none, []]
           and states(pause_target) not in
               ['off', 'unavailable', 'unknown', 'standby', 'idle', 'paused'] }}
      is_evening: >-
        {% set cur = now().hour * 60 + now().minute %}
        {% set sp = evening_start.split(':') %}
        {% set ep = evening_end.split(':') %}
        {% set s = sp[0] | int * 60 + sp[1] | int %}
        {% set e = ep[0] | int * 60 + ep[1] | int %}
        {{ evening_enabled and s != e and
           ((s < e and s <= cur < e) or (s > e and (cur >= s or cur < e))) }}
      use_evening_chime: >-
        {{ is_evening and evening_chime.media_content_id is defined
           and evening_chime.media_content_id }}
      active_chime: "{{ evening_chime if use_evening_chime else chime }}"
      active_volume: "{{ evening_volume if is_evening else chime_volume }}"
  # Pause the TV / streamer first, if it's on and one was selected.
  - if:
      - condition: template
        value_template: "{{ did_pause }}"
    then:
      - action: media_player.media_pause
        target:
          entity_id: !input pause_target
  # Set the chime volume (restored after the chime).
  - if:
      - condition: template
        value_template: "{{ control_volume }}"
    then:
      - action: media_player.volume_set
        target:
          entity_id: !input target_speakers
        data:
          volume_level: "{{ active_volume | float / 100 }}"
  # Play the chime (announce ducks/overlays current audio). The sound follows
  # the time of day (evening sound during the evening window, else daytime).
  - action: media_player.play_media
    target:
      entity_id: !input target_speakers
    data:
      media_content_id: "{{ active_chime.media_content_id }}"
      media_content_type: "{{ active_chime.media_content_type }}"
      announce: true
  # Wait for the chime to actually finish before restoring input / resuming.
  # Watches the primary speaker's state; falls back to a fixed wait if the
  # device never reports a "playing" state for the announcement.
  - if:
      - condition: template
        value_template: "{{ restore_source or (did_pause and pause_resume) }}"
    then:
      - wait_template: "{{ is_state(primary_speaker, 'playing') }}"
        timeout:
          seconds: 3
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.completed }}"
        then:
          # Chime started -> wait until it stops (capped at the max).
          - wait_template: "{{ not is_state(primary_speaker, 'playing') }}"
            timeout:
              seconds: !input chime_wait
            continue_on_timeout: true
        else:
          # Device didn't report playback -> fall back to the configured wait.
          - delay:
              seconds: !input chime_wait
  # Restore the previous volume after the chime.
  - if:
      - condition: template
        value_template: "{{ control_volume }}"
    then:
      - repeat:
          for_each: "{{ saved_state }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.item.volume is number }}"
              then:
                - action: media_player.volume_set
                  target:
                    entity_id: "{{ repeat.item.entity_id }}"
                  data:
                    volume_level: "{{ repeat.item.volume }}"
  # Restore the previous input after the chime (for TV / physical-input use).
  - if:
      - condition: template
        value_template: "{{ restore_source }}"
    then:
      - repeat:
          for_each: "{{ saved_state }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.item.source not in [none, 'unknown', 'unavailable', ''] }}"
              then:
                - action: media_player.select_source
                  target:
                    entity_id: "{{ repeat.item.entity_id }}"
                  data:
                    source: "{{ repeat.item.source }}"
  # Resume the paused TV / streamer (only if we paused it and resume is on).
  - if:
      - condition: template
        value_template: "{{ did_pause and pause_resume }}"
    then:
      - action: media_player.media_play
        target:
          entity_id: !input pause_target
  # Cooldown: with mode "single", holding this run open suppresses repeat
  # presses for the configured window (skipped when set to 0).
  - delay:
      seconds: !input cooldown
