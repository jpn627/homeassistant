blueprint:
  name: Inovelli White Fan Switch - Tap Sequences with LED Colors
  description: |
    ## Inovelli White Fan Switch — Tap Sequences with LED Bar Colors

    A fork of jay-kub's excellent *Inovelli Matter Switch Tap Sequences*
    blueprint, built for the **White Series Fan Switch (VTM35-SN)** and the
    **White Fan/Light Canopy Module (VTM36)**.

    ### What this adds

    Everything jay-kub's blueprint does, **plus** an easy way to set the
    switch's LED bar color for *each* button action. Pick a color next to any
    tap/hold action and the LED bar changes to that color right before the
    action runs — perfect for showing fan speed, scene, or mode at a glance.

    Every color defaults to **"No Change"**, so the LED bar is only ever
    touched for the actions you explicitly assign a color to.

    ### This blueprint will:

      - Perform predefined actions when a button is tapped (1–5×), held, or released
      - Optionally set the LED bar color for each of those actions
      - Bind the Inovelli switch's light entity to a target light (on/off + brightness)
      - Bind a target fan to the Config button (Held = Off, 1× = Low, 2× = Med, 3× = High)

    ### Setting up the LED Bar Color

    The White Series LED bar color is controlled by a **select** entity (found
    under Settings > Devices & services > Matter > *your device* > Controls).
    Select that entity in the **LED Bar Color** section below.

    Supported colors (the only values the switch accepts):
    **White, Red, Orange, Lemon, Lime, Green, Teal, Cyan, Aqua, Blue,
    Violet, Magenta, Pink**

    ### Light Binding

    Light binding syncs the on/off state and brightness from the Inovelli
    switch to a target light. For the smoothest result:

      - Slow the dimming speed on the Inovelli switch to account for lag
      - Set transition speed to 0 on all devices
      - Match the default "on" brightness across devices
      - If your target light supports Matter binding, prefer that and disable light binding here

    ### Supported Models
      - VTM35-SN (White Fan Switch)
      - VTM36 (White Fan/Light Canopy Module)
      - VTM30-SN / VTM31-SN (White On/Off & Dimmer) also work for the button + LED features

    ### Credits

    Forked from jay-kub's *Inovelli Matter Switch Tap Sequences* (v0.3.4):
    https://github.com/jay-kub/inovelli-matter-switch-tap-sequences

    #### Fork Version 1.0.0
    Added per-action LED bar color selection.
  domain: automation
  author: jpn627 (fork of jay-kub)
  homeassistant:
    min_version: 2024.8.0
  input:
