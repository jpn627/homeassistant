mode: queued
max_exceeded: silent
variables:
  reverseSyncEnabled: !input reverse_sync
  inovelliLight: !input entity_light
  targetFan: !input target_fan
  brightnessSyncEnabled: !input brightness_sync
  ledSelect: !input led_select_entity
  colorUp1: !input color_up1
  colorUp2: !input color_up2
  colorUp3: !input color_up3
  colorUp4: !input color_up4
  colorUp5: !input color_up5
  colorUpHeld: !input color_upHeld
  colorUpReleased: !input color_upReleased
  colorDown1: !input color_down1
  colorDown2: !input color_down2
  colorDown3: !input color_down3
  colorDown4: !input color_down4
  colorDown5: !input color_down5
  colorDownHeld: !input color_downHeld
  colorDownReleased: !input color_downReleased
  colorConfig1: !input color_config1
  colorConfig2: !input color_config2
  colorConfig3: !input color_config3
  colorConfig4: !input color_config4
  colorConfig5: !input color_config5
  colorConfigHeld: !input color_configHeld
  colorConfigReleased: !input color_configReleased

trigger:
  - platform: state
    entity_id: !input entity_up
    not_from:
    - unavailable
    id: up
  - platform: state
    entity_id: !input entity_down
    not_from:
    - unavailable
    id: down
  - platform: state
    entity_id: !input entity_config
    not_from:
    - unavailable
    id: config
  - platform: state
    entity_id: !input entity_light
    id: turnOff
    from: "on"
    to: "off"
  - platform: state
    enabled: '{{ inovelliLight is not none and not (brightnessSyncEnabled | default(false)) }}'
    entity_id: !input entity_light
    id: turnOn
    from: "off"
    to: "on"
  - platform: state
    entity_id: !input target_light
    id: reverseSyncTurnOff
    from: "on"
    to: "off"
  - platform: state
    entity_id: !input target_light
    id: reverseSyncTurnOn
    from: "off"
    to: "on"
  - platform: state
    enabled: '{{ inovelliLight is not none }}'
    entity_id: !input entity_light
    attribute: brightness
    id: turnOnWithBrightness

condition: []

action:
- choose:
  - conditions:
    - condition: trigger
      id:
      - up
    sequence:
    - choose:
      - conditions:
        - condition: state
          entity_id: !input entity_up
          attribute: event_type
          state: multi_press_1
        sequence:
        - if:
          - condition: template
            value_template: "{{ ledSelect not in [none, []] and colorUp1 != 'No Change' }}"
          then:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: "{{ colorUp1 }}"
        - choose: []
          default: !input up1
      - conditions:
        - condition: state
