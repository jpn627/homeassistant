                - "White"
                - "Red"
                - "Orange"
                - "Lemon"
                - "Lime"
                - "Green"
                - "Teal"
                - "Cyan"
                - "Aqua"
                - "Blue"
                - "Violet"
                - "Magenta"
                - "Pink"
        up2:
          name: Double
          description: When Up is pressed 2 times
          default: []
          selector:
            action: {}
        color_up2:
          name: Double - LED Color
          description: LED bar color to set when Up is pressed 2 times
          default: "No Change"
          selector:
            select:
              mode: dropdown
              options: *led_colors
        up3:
