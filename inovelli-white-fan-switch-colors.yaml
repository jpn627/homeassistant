blueprint:
  name: Inovelli Matter Switch Tap Sequences + LED Color Selector
  description: Fully customizable Inovelli Matter multi-tap handler with independent, user-selectable LED bar colors for each sequence.
  domain: automation
  input:
    # --- Device & Entity Configuration ---
    entity_config:
      name: Config button entity
      selector:
        entity:
          domain: event
    entity_up:
      name: Up button entity
      selector:
        entity:
          domain: event
    entity_down:
      name: Down button entity
      selector:
        entity:
          domain: event
    led_select_entity:
      name: LED Color Select Entity
      description: The select entity that controls the Inovelli switch's LED bar color.
      selector:
        entity:
          domain: select

    # --- Sequence Actions (From the original layout) ---
    up1:
      name: Up button - 1 tap actions
      default: []
      selector:
        action: {}
    up2:
      name: Up button - 2 tap actions
      default: []
      selector:
        action: {}
    up3:
      name: Up button - 3 tap actions
      default: []
      selector:
        action: {}
    down1:
      name: Down button - 1 tap actions
      default: []
      selector:
        action: {}
    config1:
      name: Config button - 1 tap actions
      default: []
      selector:
        action: {}

    # --- Matching Custom Color Dropdowns ---
    color_up1:
      name: Up button - 1 tap LED Color
      default: White
      selector:
        select:
          options: &led_colors
            - "White"
            - "Red"
            - "Green"
            - "Blue"
            - "Cyan"
            - "Magenta"
            - "Yellow"
            - "Orange"
            - "Aqua"
            - "Purple"
            - "Pink"
    color_up2:
      name: Up button - 2 tap LED Color
      default: Cyan
      selector:
        select:
          options: *led_colors
    color_up3:
      name: Up button - 3 tap LED Color
      default: Blue
      selector:
        select:
          options: *led_colors
    color_down1:
      name: Down button - 1 tap LED Color
      default: Red
      selector:
        select:
          options: *led_colors
    color_config1:
      name: Config button - 1 tap LED Color
      default: White
      selector:
        select:
          options: *led_colors

trigger:
  - platform: state
    entity_id: !input entity_config
    id: config
  - platform: state
    entity_id: !input entity_up
    id: up
  - platform: state
    entity_id: !input entity_down
    id: down

condition: []

action:
  - choose:
      # --- 1 Tap UP ---
      - conditions:
          - condition: trigger
            id: up
          - condition: state
            entity_id: !input entity_up
            attribute: event_type
            state: multi_press_1
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_up1
          - choose: []
            default: !input up1

      # --- 2 Taps UP ---
      - conditions:
          - condition: trigger
            id: up
          - condition: state
            entity_id: !input entity_up
            attribute: event_type
            state: multi_press_2
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_up2
          - choose: []
            default: !input up2

      # --- 3 Taps UP ---
      - conditions:
          - condition: trigger
            id: up
          - condition: state
            entity_id: !input entity_up
            attribute: event_type
            state: multi_press_3
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_up3
          - choose: []
            default: !input up3

      # --- 1 Tap DOWN ---
      - conditions:
          - condition: trigger
            id: down
          - condition: state
            entity_id: !input entity_down
            attribute: event_type
            state: multi_press_1
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_down1
          - choose: []
            default: !input down1

      # --- 1 Tap CONFIG ---
      - conditions:
          - condition: trigger
            id: config
          - condition: state
            entity_id: !input entity_config
            attribute: event_type
            state: multi_press_1
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_config1
          - choose: []
            default: !input config1

mode: single
