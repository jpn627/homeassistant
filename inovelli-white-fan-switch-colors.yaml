        - if:
          - condition: template
            value_template: "{{ ledSelect not in [none, []] and colorConfigHeld != 'No Change' }}"
          then:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: "{{ colorConfigHeld }}"
        - choose: []
          default: !input configHeld
      - conditions:
        - condition: state
          entity_id: !input entity_config
          attribute: event_type
          state: long_release
        sequence:
        - if:
          - condition: template
            value_template: "{{ ledSelect not in [none, []] and colorConfigReleased != 'No Change' }}"
          then:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: "{{ colorConfigReleased }}"
        - choose: []
          default: !input configReleased
  - conditions:
      - condition: trigger
        id:
          - turnOff
    sequence:
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: !input target_light
  - conditions:
      - condition: trigger
        id:
          - turnOn
    sequence:
    - action: light.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: !input target_light
  - conditions:
      - condition: trigger
        id:
          - reverseSyncTurnOff
          - reverseSyncTurnOn
    sequence:
      - if: '{{ reverseSyncEnabled }}'
        then:
          - choose:
              - conditions:
                  - condition: trigger
                    id:
                      - reverseSyncTurnOff
                sequence:
                - action: light.turn_off
                  target:
                    entity_id: !input entity_light
                  data: {}
              - conditions:
                  - condition: trigger
                    id:
                      - reverseSyncTurnOn
                sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input entity_light
                  data: {}
  - conditions:
      - condition: trigger
        id:
          - turnOnWithBrightness
      - condition: state
        entity_id: !input entity_light
        state: "on"
    sequence:
    - variables:
        inovelliLightBrightness: |
          {{ (state_attr(inovelliLight, 'brightness') / 2.55) }}
        minBrightness: !input min_brightness
        targetBrightnessPct: |
          {{ (((100 - minBrightness) / 100 ) * inovelliLightBrightness + minBrightness ) | round(0) }}
        brightnessSyncEnabled: !input brightness_sync
    - choose:
      - conditions: '{{ inovelliLightBrightness != 0 }}'
        sequence:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: '{{ targetBrightnessPct }}'
          target:
            entity_id: !input target_light
- if:
  - condition: template
    value_template: "{{ targetFan != [] }}"
  - condition: trigger
    id:
      - config
  then:
    - choose:
      - conditions:
        - condition: state
          entity_id: !input entity_config
          attribute: event_type
          state: multi_press_1
        sequence:
        - action: fan.turn_on
          data:
            percentage: 33
          target:
           entity_id: !input target_fan
      - conditions:
        - condition: state
          entity_id: !input entity_config
          attribute: event_type
          state: multi_press_2
        sequence:
        - action: fan.turn_on
          data:
            percentage: 66
          target:
           entity_id: !input target_fan
      - conditions:
        - condition: state
          entity_id: !input entity_config
          attribute: event_type
          state: multi_press_3
        sequence:
        - action: fan.turn_on
          data:
            percentage: 100
          target:
           entity_id: !input target_fan
      - conditions:
        - condition: state
          entity_id: !input entity_config
          attribute: event_type
          state: long_press
        sequence:
        - action: fan.turn_off
          target:
           entity_id: !input target_fan
