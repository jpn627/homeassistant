blueprint:
  name: Inovelli Matter Switch Tap Sequences (with Injected LED Colors)
  description: A complete fork of jay-kub's multi-tap handler, preserving original UI sections and adding custom LED bar color fields directly adjacent to their respective click sequence actions.
  domain: automation
  input:
    entity_config:
      name: Config button entity
      selector:
        entity:
          domain: event
    entity_up:
      name: Up button entity
      selector:
        entity:
          domain: event
    entity_down:
      name: Down button entity
      selector:
        entity:
          domain: event
    led_select_entity:
      name: LED Color Select Entity
      description: The select entity that controls the Inovelli switch's LED bar color.
      selector:
        entity:
          domain: select

    # ==========================================
    #   LIGHT BINDING SECTION (ZIPPIE 1)
    # ==========================================
    entity_light:
      name: (Optional) Local Switch Light Entity
      description: The local light entity of the physical Inovelli switch used for brightness synchronization.
      default: []
      input_section: light_sync
      selector:
        entity:
          domain: light
    target_light:
      name: (Optional) Target Light Entity
      description: The master smart light or canopy light entity to sync brightness and states with.
      default: []
      input_section: light_sync
      selector:
        entity:
          domain: light
    reverse_sync:
      name: Enable Reverse Synchronization
      description: Synchronize state changes from the target light back to the local switch.
      default: false
      input_section: light_sync
      selector:
        boolean: {}
    min_brightness:
      name: Minimum Brightness
      description: The minimum scaling brightness value for your light fixtures.
      default: 1
      input_section: light_sync
      selector:
        number:
          min: 1
          max: 255

    # ==========================================
    #   UP BUTTON SEQUENCES (ZIPPIE 2)
    # ==========================================
    up1:
      name: Up button - 1 tap actions
      default: []
      input_section: up_button
      selector:
        action: {}
    color_up1:
      name: Up button - 1 tap LED Color
      default: White
      input_section: up_button
      selector:
        select:
          options: &led_colors
            - "White"
            - "Red"
            - "Green"
            - "Blue"
            - "Cyan"
            - "Magenta"
            - "Yellow"
            - "Orange"
            - "Aqua"
            - "Purple"
            - "Pink"

    up2:
      name: Up button - 2 tap actions
      default: []
      input_section: up_button
      selector:
        action: {}
    color_up2:
      name: Up button - 2 tap LED Color
      default: Cyan
      input_section: up_button
      selector:
        select:
          options: *led_colors

    up3:
      name: Up button - 3 tap actions
      default: []
      input_section: up_button
      selector:
        action: {}
    color_up3:
      name: Up button - 3 tap LED Color
      default: Blue
      input_section: up_button
      selector:
        select:
          options: *led_colors

    up4:
      name: Up button - 4 tap actions
      default: []
      input_section: up_button
      selector:
        action: {}
    color_up4:
      name: Up button - 4 tap LED Color
      default: Purple
      input_section: up_button
      selector:
        select:
          options: *led_colors

    up5:
      name: Up button - 5 tap actions
      default: []
      input_section: up_button
      selector:
        action: {}
    color_up5:
      name: Up button - 5 tap LED Color
      default: Pink
      input_section: up_button
      selector:
        select:
          options: *led_colors

    # ==========================================
    #   DOWN BUTTON SEQUENCES (ZIPPIE 3)
    # ==========================================
    down1:
      name: Down button - 1 tap actions
      default: []
      input_section: down_button
      selector:
        action: {}
    color_down1:
      name: Down button - 1 tap LED Color
      default: Red
      input_section: down_button
      selector:
        select:
          options: *led_colors

    down2:
      name: Down button - 2 tap actions
      default: []
      input_section: down_button
      selector:
        action: {}
    color_down2:
      name: Down button - 2 tap LED Color
      default: Orange
      input_section: down_button
      selector:
        select:
          options: *led_colors

    down3:
      name: Down button - 3 tap actions
      default: []
      input_section: down_button
      selector:
        action: {}
    color_down3:
      name: Down button - 3 tap LED Color
      default: Yellow
      input_section: down_button
      selector:
        select:
          options: *led_colors

    down4:
      name: Down button - 4 tap actions
      default: []
      input_section: down_button
      selector:
        action: {}
    color_down4:
      name: Down button - 4 tap LED Color
      default: Magenta
      input_section: down_button
      selector:
        select:
          options: *led_colors

    down5:
      name: Down button - 5 tap actions
      default: []
      input_section: down_button
      selector:
        action: {}
    color_down5:
      name: Down button - 5 tap LED Color
      default: Red
      input_section: down_button
      selector:
        select:
          options: *led_colors

    # ==========================================
    #   CONFIG BUTTON SEQUENCES (ZIPPIE 4)
    # ==========================================
    config1:
      name: Config button - 1 tap actions
      default: []
      input_section: config_button
      selector:
        action: {}
    color_config1:
      name: Config button - 1 tap LED Color
      default: White
      input_section: config_button
      selector:
        select:
          options: *led_colors

    config2:
      name: Config button - 2 tap actions
      default: []
      input_section: config_button
      selector:
        action: {}
    color_config2:
      name: Config button - 2 tap LED Color
      default: White
      input_section: config_button
      selector:
        select:
          options: *led_colors

    config3:
      name: Config button - 3 tap actions
      default: []
      input_section: config_button
      selector:
        action: {}
    color_config3:
      name: Config button - 3 tap LED Color
      default: White
      input_section: config_button
      selector:
        select:
          options: *led_colors

    config4:
      name: Config button - 4 tap actions
      default: []
      input_section: config_button
      selector:
        action: {}
    color_config4:
      name: Config button - 4 tap LED Color
      default: White
      input_section: config_button
      selector:
        select:
          options: *led_colors

    config5:
      name: Config button - 5 tap actions
      default: []
      input_section: config_button
      selector:
        action: {}
    color_config5:
      name: Config button - 5 tap LED Color
      default: White
      input_section: config_button
      selector:
        select:
          options: *led_colors

variables:
  local_light: !input entity_light
  remote_light: !input target_light
  is_reverse_sync: !input reverse_sync

trigger:
  - platform: state
    entity_id: !input entity_config
    id: config
  - platform: state
    entity_id: !input entity_up
    id: up
  - platform: state
    entity_id: !input entity_down
    id: down
  - platform: state
    entity_id: !input entity_light
    id: local_light_changed
  - platform: state
    entity_id: !input target_light
    id: remote_light_changed

condition: []

action:
  - choose:
      # --- UP BUTTON CODES ---
      - conditions:
          - condition: trigger
            id: up
          - condition: state
            entity_id: !input entity_up
            attribute: event_type
            state: multi_press_1
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_up1
          - choose: []
            default: !input up1
      - conditions:
          - condition: trigger
            id: up
          - condition: state
            entity_id: !input entity_up
            attribute: event_type
            state: multi_press_2
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_up2
          - choose: []
            default: !input up2
      - conditions:
          - condition: trigger
            id: up
          - condition: state
            entity_id: !input entity_up
            attribute: event_type
            state: multi_press_3
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_up3
          - choose: []
            default: !input up3
      - conditions:
          - condition: trigger
            id: up
          - condition: state
            entity_id: !input entity_up
            attribute: event_type
            state: multi_press_4
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_up4
          - choose: []
            default: !input up4
      - conditions:
          - condition: trigger
            id: up
          - condition: state
            entity_id: !input entity_up
            attribute: event_type
            state: multi_press_5
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_up5
          - choose: []
            default: !input up5

      # --- DOWN BUTTON CODES ---
      - conditions:
          - condition: trigger
            id: down
          - condition: state
            entity_id: !input entity_down
            attribute: event_type
            state: multi_press_1
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_down1
          - choose: []
            default: !input down1
      - conditions:
          - condition: trigger
            id: down
          - condition: state
            entity_id: !input entity_down
            attribute: event_type
            state: multi_press_2
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_down2
          - choose: []
            default: !input down2
      - conditions:
          - condition: trigger
            id: down
          - condition: state
            entity_id: !input entity_down
            attribute: event_type
            state: multi_press_3
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_down3
          - choose: []
            default: !input down3
      - conditions:
          - condition: trigger
            id: down
          - condition: state
            entity_id: !input entity_down
            attribute: event_type
            state: multi_press_4
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_down4
          - choose: []
            default: !input down4
      - conditions:
          - condition: trigger
            id: down
          - condition: state
            entity_id: !input entity_down
            attribute: event_type
            state: multi_press_5
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_down5
          - choose: []
            default: !input down5

      # --- CONFIG BUTTON CODES ---
      - conditions:
          - condition: trigger
            id: config
          - condition: state
            entity_id: !input entity_config
            attribute: event_type
            state: multi_press_1
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_config1
          - choose: []
            default: !input config1
      - conditions:
          - condition: trigger
            id: config
          - condition: state
            entity_id: !input entity_config
            attribute: event_type
            state: multi_press_2
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_config2
          - choose: []
            default: !input config2
      - conditions:
          - condition: trigger
            id: config
          - condition: state
            entity_id: !input entity_config
            attribute: event_type
            state: multi_press_3
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_config3
          - choose: []
            default: !input config3
      - conditions:
          - condition: trigger
            id: config
          - condition: state
            entity_id: !input entity_config
            attribute: event_type
            state: multi_press_4
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_config4
          - choose: []
            default: !input config4
      - conditions:
          - condition: trigger
            id: config
          - condition: state
            entity_id: !input entity_config
            attribute: event_type
            state: multi_press_5
        sequence:
          - action: select.select_option
            target:
              entity_id: !input led_select_entity
            data:
              option: !input color_config5
          - choose: []
            default: !input config5

      # --- NATIVE LIGHT SYNC CORE ---
      - conditions:
          - condition: trigger
            id: local_light_changed
          - condition: template
            value_template: "{{ remote_light != [] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.to_state.state == 'on' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      brightness: >-
                        {% set b = state_attr(local_light, 'brightness') %}
                        {{ b if b is not none else 255 }}
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.to_state.state == 'off' }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: !input target_light

      - conditions:
          - condition: trigger
            id: remote_light_changed
          - condition: template
            value_template: "{{ local_light != [] and is_reverse_sync }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.to_state.state == 'on' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input entity_light
                    data:
                      brightness: >-
                        {% set b = state_attr(remote_light, 'brightness') %}
                        {{ b if b is not none else 255 }}
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.to_state.state == 'off' }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: !input entity_light

mode: restart
